<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="输入一次完整需求，生成同一份答案的七种液态网页形态。"><title>液态智能网页 · Liquid Intelligent Web</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="product-links.css"><link rel="stylesheet" href="loading.css"></head><body>
<main id="start" class="start"><header class="brand"><b>液态智能网页 <i>·</i> Liquid Intelligent Web</b><span>同一个 Query，千种呈现——这是 AI 时代的网页新范式</span></header><form id="query-form" class="query-panel"><label for="query">🪄 Enter Query Input</label><textarea id="query" required maxlength="6000" placeholder="把目标、预算、偏好、已有资料和限制条件一次写清楚……"></textarea><button id="generate" class="primary" type="submit">✦ 让 AI 生成专属网页</button></form><p id="connection" class="connection" role="status"></p><p id="error" class="error" role="alert"></p><div class="start-hint"><span>1</span> 写下完整需求 <b>→</b><span>2</span> 选择网页形态 <b>→</b><span>3</span> 得到可操作答案</div></main>
<main id="selection" class="selection hidden"><button id="new-query" class="back">← 修改 Query</button><header><p>🎨 同样的数据 · 7 种液态形态</p><h1 id="selection-title"></h1><span id="selection-query"></span></header><p id="plan-error" class="error" role="alert"></p><div class="form-grid" id="form-grid"></div><div class="selection-stats"><b>7<small>种形态</small></b><b>1<small>份统一答案</small></b><b>100%<small>约束保留</small></b><b>∞<small>任务可能</small></b></div></main>
<main id="result" class="result hidden"></main><script src="app.js"></script></body></html>
